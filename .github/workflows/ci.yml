name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile scripts/*.py
      - run: pytest -q tests/test_benchmark_schema.py tests/test_euroc_proxy.py tests/test_evaluate_trajectory.py

  ros2:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble
      - run: |
          source /opt/ros/humble/setup.bash
          cd ros2_ws
          rosdep install --from-paths src --ignore-src -r -y
          colcon build --symlink-install --packages-select aegis_core aegis_msgs aegis_ros
          colcon test --packages-select aegis_core aegis_ros
          colcon test-result --verbose
